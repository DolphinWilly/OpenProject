<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Game Arcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 12px;
            padding: 36px 32px;
            width: 100%;
            max-width: 420px;
        }

        .auth-card h1 {
            color: #00d4ff;
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        .auth-card .subtitle {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #ff6b6b;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: #0f0f23;
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #eee;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #00d4ff;
        }

        .form-group select {
            cursor: pointer;
        }

        .error-msg {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #ff6b6b;
            margin-bottom: 16px;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #00d4ff;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #00b8e6;
        }

        .footer-link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .footer-link a {
            color: #00d4ff;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        a.back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            color: #00d4ff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">&larr; Back to Arcade</a>

    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Join the arcade and track your scores.</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="signupForm">
            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" id="username" placeholder="Choose a username" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label>Date of Birth <span class="required">*</span></label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="">Prefer not to say</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <p class="footer-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <script src="auth.js"></script>
    <script>
    (function () {
        // If already logged in, redirect to portal
        if (Auth.isLoggedIn()) {
            window.location.href = '../index.html';
            return;
        }

        const form = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                dateOfBirth: document.getElementById('dob').value,
                gender: document.getElementById('gender').value,
            };

            const result = Auth.signup(data);

            if (result.success) {
                window.location.href = '../index.html';
            } else {
                errorMsg.textContent = result.error;
                errorMsg.style.display = 'block';
            }
        });
    })();
    </script>
</body>
</html>
