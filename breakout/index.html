<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #00d4ff;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1rem;
            color: #aaa;
        }

        .stats span {
            color: #fff;
            font-weight: bold;
        }

        canvas {
            background: #0f0f23;
            border-radius: 8px;
            border: 2px solid #0f3460;
            display: block;
            margin-top: 8px;
        }

        .controls-info {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #666;
        }

        a.back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            color: #00d4ff;
            text-decoration: none;
            font-size: 0.9rem;
        }

        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">&larr; Back to Arcade</a>

    <div class="header">
        <h1>Breakout</h1>
        <div class="stats">
            Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="bestScore">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <p class="controls-info">Arrow keys or A/D to move paddle &middot; Space to launch / restart</p>

    <script src="../auth/auth.js"></script>
    <script>
    (function () {
        // ─── CONFIGURATION ─────────────────────────────────────────
        const CONFIG = {
            canvasWidth: 640,
            canvasHeight: 480,
            paddleWidth: 100,
            paddleHeight: 14,
            paddleSpeed: 7,
            paddleColor: '#00d4ff',
            paddleRadius: 7,
            ballRadius: 8,
            baseBallSpeed: 3,       // 60% of original 5 → starts at 3
            speedBoostPerRow: 0.2,  // +20% per cleared row
            ballColor: '#ffffff',
            brickRowCount: 5,
            brickColumnCount: 9,
            brickWidth: 60,
            brickHeight: 20,
            brickPadding: 6,
            brickOffsetTop: 50,
            brickOffsetLeft: 35,
            brickColors: ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'],
            maxBallAngle: Math.PI / 3,
        };

        // ─── STATE ─────────────────────────────────────────────────
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');

        let paddle, ball, bricks, score, gameState;
        let clearedRows, pointsPerBrick, currentBallSpeed;
        let totalBricksAlive;
        let keys = {};

        // gameState: 'waiting' | 'playing' | 'won' | 'lost'

        // ─── INITIALIZATION ────────────────────────────────────────
        function init() {
            score = 0;
            clearedRows = 0;
            pointsPerBrick = 1;
            currentBallSpeed = CONFIG.baseBallSpeed;
            totalBricksAlive = CONFIG.brickRowCount * CONFIG.brickColumnCount;
            gameState = 'waiting';
            scoreEl.textContent = score;

            paddle = {
                x: (CONFIG.canvasWidth - CONFIG.paddleWidth) / 2,
                y: CONFIG.canvasHeight - 40,
                width: CONFIG.paddleWidth,
                height: CONFIG.paddleHeight,
            };

            resetBall();
            createBricks();
        }

        function resetBall() {
            ball = {
                x: paddle.x + paddle.width / 2,
                y: paddle.y - CONFIG.ballRadius - 1,
                dx: 0,
                dy: 0,
                radius: CONFIG.ballRadius,
                attached: true,
            };
        }

        function launchBall() {
            if (!ball.attached) return;
            ball.attached = false;
            const angle = (Math.random() - 0.5) * (Math.PI / 4);
            ball.dx = currentBallSpeed * Math.sin(angle);
            ball.dy = -currentBallSpeed * Math.cos(angle);
            gameState = 'playing';
        }

        function createBricks() {
            bricks = [];
            for (let row = 0; row < CONFIG.brickRowCount; row++) {
                bricks[row] = [];
                for (let col = 0; col < CONFIG.brickColumnCount; col++) {
                    bricks[row][col] = {
                        x: CONFIG.brickOffsetLeft + col * (CONFIG.brickWidth + CONFIG.brickPadding),
                        y: CONFIG.brickOffsetTop + row * (CONFIG.brickHeight + CONFIG.brickPadding),
                        width: CONFIG.brickWidth,
                        height: CONFIG.brickHeight,
                        alive: true,
                        color: CONFIG.brickColors[row % CONFIG.brickColors.length],
                    };
                }
            }
        }

        // ─── SCORING LOGIC ─────────────────────────────────────────
        // Count how many complete rows have been cleared.
        // We maintain a cached count and recheck only when a brick is destroyed.
        function countClearedRows() {
            let count = 0;
            for (let row = 0; row < CONFIG.brickRowCount; row++) {
                let rowCleared = true;
                for (let col = 0; col < CONFIG.brickColumnCount; col++) {
                    if (bricks[row][col].alive) {
                        rowCleared = false;
                        break;
                    }
                }
                if (rowCleared) count++;
            }
            return count;
        }

        function onBrickDestroyed() {
            // Add points based on current multiplier
            score += pointsPerBrick;
            scoreEl.textContent = score;
            totalBricksAlive--;

            // Check if a new row has been fully cleared
            const newClearedRows = countClearedRows();
            if (newClearedRows > clearedRows) {
                clearedRows = newClearedRows;
                pointsPerBrick = 1 + clearedRows;

                // Increase ball speed by 20% per cleared row
                currentBallSpeed = CONFIG.baseBallSpeed * (1 + clearedRows * CONFIG.speedBoostPerRow);

                // Apply new speed to current ball direction
                const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                if (currentSpeed > 0) {
                    const ratio = currentBallSpeed / currentSpeed;
                    ball.dx *= ratio;
                    ball.dy *= ratio;
                }
            }

            // Check win
            if (totalBricksAlive <= 0) {
                gameState = 'won';
                saveScore();
            }
        }

        // ─── INPUT ─────────────────────────────────────────────────
        document.addEventListener('keydown', function (e) {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                if (gameState === 'waiting') {
                    launchBall();
                } else if (gameState === 'won' || gameState === 'lost') {
                    init();
                }
            }
        });

        document.addEventListener('keyup', function (e) {
            keys[e.key] = false;
        });

        // ─── UPDATE ────────────────────────────────────────────────
        function update() {
            // Paddle movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                paddle.x -= CONFIG.paddleSpeed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                paddle.x += CONFIG.paddleSpeed;
            }

            // Clamp paddle
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > CONFIG.canvasWidth) {
                paddle.x = CONFIG.canvasWidth - paddle.width;
            }

            // Ball attached to paddle
            if (ball.attached) {
                ball.x = paddle.x + paddle.width / 2;
                ball.y = paddle.y - ball.radius - 1;
                return;
            }

            if (gameState !== 'playing') return;

            // Move ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collisions (left/right)
            if (ball.x - ball.radius <= 0) {
                ball.x = ball.radius;
                ball.dx = Math.abs(ball.dx);
            }
            if (ball.x + ball.radius >= CONFIG.canvasWidth) {
                ball.x = CONFIG.canvasWidth - ball.radius;
                ball.dx = -Math.abs(ball.dx);
            }

            // Top wall
            if (ball.y - ball.radius <= 0) {
                ball.y = ball.radius;
                ball.dy = Math.abs(ball.dy);
            }

            // Bottom — game over (1 life only)
            if (ball.y + ball.radius >= CONFIG.canvasHeight) {
                gameState = 'lost';
                saveScore();
                return;
            }

            // Paddle collision
            if (
                ball.dy > 0 &&
                ball.y + ball.radius >= paddle.y &&
                ball.y + ball.radius <= paddle.y + paddle.height &&
                ball.x >= paddle.x &&
                ball.x <= paddle.x + paddle.width
            ) {
                const hitPos = (ball.x - paddle.x) / paddle.width;
                const angle = (hitPos - 0.5) * 2 * CONFIG.maxBallAngle;
                ball.dx = currentBallSpeed * Math.sin(angle);
                ball.dy = -currentBallSpeed * Math.cos(angle);
                ball.y = paddle.y - ball.radius - 1;
            }

            // Brick collisions
            for (let row = 0; row < CONFIG.brickRowCount; row++) {
                for (let col = 0; col < CONFIG.brickColumnCount; col++) {
                    const brick = bricks[row][col];
                    if (!brick.alive) continue;

                    if (
                        ball.x + ball.radius > brick.x &&
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y &&
                        ball.y - ball.radius < brick.y + brick.height
                    ) {
                        brick.alive = false;

                        // Determine which side was hit
                        const overlapLeft = (ball.x + ball.radius) - brick.x;
                        const overlapRight = (brick.x + brick.width) - (ball.x - ball.radius);
                        const overlapTop = (ball.y + ball.radius) - brick.y;
                        const overlapBottom = (brick.y + brick.height) - (ball.y - ball.radius);

                        const minOverlapX = Math.min(overlapLeft, overlapRight);
                        const minOverlapY = Math.min(overlapTop, overlapBottom);

                        if (minOverlapX < minOverlapY) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }

                        onBrickDestroyed();
                        break;
                    }
                }
            }
        }

        // ─── DRAW ──────────────────────────────────────────────────
        function draw() {
            ctx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);

            // Draw bricks
            for (let row = 0; row < CONFIG.brickRowCount; row++) {
                for (let col = 0; col < CONFIG.brickColumnCount; col++) {
                    const brick = bricks[row][col];
                    if (!brick.alive) continue;
                    ctx.fillStyle = brick.color;
                    ctx.beginPath();
                    roundRect(ctx, brick.x, brick.y, brick.width, brick.height, 4);
                    ctx.fill();
                }
            }

            // Draw paddle
            ctx.fillStyle = CONFIG.paddleColor;
            ctx.beginPath();
            roundRect(ctx, paddle.x, paddle.y, paddle.width, paddle.height, CONFIG.paddleRadius);
            ctx.fill();

            // Draw ball
            ctx.fillStyle = CONFIG.ballColor;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw overlays
            if (gameState === 'waiting' && ball.attached) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
                ctx.fillStyle = '#fff';
                ctx.font = '20px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Press SPACE to launch', CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2);
            }

            if (gameState === 'won') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
                ctx.fillStyle = '#00d4ff';
                ctx.font = 'bold 36px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('YOU WIN!', CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2 - 30);
                ctx.fillStyle = '#fff';
                ctx.font = '22px "Segoe UI", sans-serif';
                ctx.fillText('Score: ' + score, CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2 + 10);
                ctx.fillStyle = '#aaa';
                ctx.font = '16px "Segoe UI", sans-serif';
                ctx.fillText('Press SPACE to play again', CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2 + 40);
            }

            if (gameState === 'lost') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 36px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2 - 30);
                ctx.fillStyle = '#fff';
                ctx.font = '22px "Segoe UI", sans-serif';
                ctx.fillText('Score: ' + score, CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2 + 10);
                ctx.fillStyle = '#aaa';
                ctx.font = '16px "Segoe UI", sans-serif';
                ctx.fillText('Press SPACE to play again', CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2 + 40);
            }
        }

        // Helper: draw rounded rectangle
        function roundRect(ctx, x, y, w, h, r) {
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ─── BEST SCORE (read from user profile) ────────────────
        function getBestScore() {
            if (typeof Auth === 'undefined' || !Auth.isLoggedIn()) return 0;
            var user = Auth.getCurrentUser();
            var profile = Auth.getProfile(user.username);
            if (!profile || !profile.gameHistory) return 0;
            var best = 0;
            profile.gameHistory.forEach(function (entry) {
                if (entry.game === 'Breakout' && entry.score > best) best = entry.score;
            });
            return best;
        }

        function refreshBestScore() {
            bestScoreEl.textContent = getBestScore();
        }

        refreshBestScore();

        // ─── SAVE SCORE ───────────────────────────────────────────
        function saveScore() {
            if (typeof Auth !== 'undefined' && Auth.isLoggedIn()) {
                Auth.addGameHistory({
                    game: 'Breakout',
                    score: score,
                });
                refreshBestScore();
            }
        }

        // ─── GAME LOOP ────────────────────────────────────────────
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start
        init();
        gameLoop();
    })();
    </script>
</body>
</html>
