<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #4cd137;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 1rem;
            color: #aaa;
        }

        .stats span {
            color: #fff;
            font-weight: bold;
        }

        canvas {
            background: #0f0f23;
            border-radius: 8px;
            border: 2px solid #0f3460;
            display: block;
            margin-top: 8px;
        }

        .controls-info {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #666;
        }

        a.back-link {
            position: fixed;
            top: 16px;
            left: 16px;
            color: #4cd137;
            text-decoration: none;
            font-size: 0.9rem;
        }

        a.back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">&larr; Back to Arcade</a>

    <div class="header">
        <h1>Snake</h1>
        <div class="stats">
            Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="bestScore">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" width="480" height="480"></canvas>
    <p class="controls-info">Arrow keys to move &middot; Space to start / restart &middot; Eat fruit to score, but don't idle!</p>

    <script src="../auth/auth.js"></script>
    <script>
    (function () {
        // ─── CONFIGURATION ─────────────────────────────────────────
        const CONFIG = {
            canvasSize: 480,
            gridSize: 20,
            cellSize: 24,
            speed: 150,             // constant ms per tick
            snakeColor: '#4cd137',
            snakeHeadColor: '#2ed573',
            fruitColor: '#ff6b6b',
            gridLineColor: 'rgba(255, 255, 255, 0.03)',
            idlePenaltyThreshold: 40,  // steps without fruit before -1 point
        };

        // ─── STATE ─────────────────────────────────────────────────
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');

        let snake, direction, nextDirection, fruit;
        let score, gameState, tickTimer;
        let fruitsEaten;          // how many fruits eaten this game (for incremental scoring)
        let stepsSinceLastFruit;  // steps since last fruit eaten (for idle penalty)

        // gameState: 'idle' | 'playing' | 'over'

        // ─── BEST SCORE (read from user profile) ────────────────
        function getBestScore() {
            if (typeof Auth === 'undefined' || !Auth.isLoggedIn()) return 0;
            var user = Auth.getCurrentUser();
            var profile = Auth.getProfile(user.username);
            if (!profile || !profile.gameHistory) return 0;
            var best = 0;
            profile.gameHistory.forEach(function (entry) {
                if (entry.game === 'Snake' && entry.score > best) best = entry.score;
            });
            return best;
        }

        function refreshBestScore() {
            bestScoreEl.textContent = getBestScore();
        }

        refreshBestScore();

        // ─── INITIALIZATION ────────────────────────────────────────
        function init() {
            const startX = Math.floor(CONFIG.gridSize / 2);
            const startY = Math.floor(CONFIG.gridSize / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY },
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            fruitsEaten = 0;
            stepsSinceLastFruit = 0;
            scoreEl.textContent = score;
            gameState = 'idle';
            placeFruit();
            draw();
        }

        function startGame() {
            if (gameState === 'playing') return;
            if (gameState === 'over') init();
            gameState = 'playing';
            tick();
        }

        function placeFruit() {
            let pos;
            do {
                pos = {
                    x: Math.floor(Math.random() * CONFIG.gridSize),
                    y: Math.floor(Math.random() * CONFIG.gridSize),
                };
            } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
            fruit = pos;
        }

        // ─── INPUT ─────────────────────────────────────────────────
        document.addEventListener('keydown', function (e) {
            if (e.key === ' ') {
                e.preventDefault();
                startGame();
                return;
            }

            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });

        // ─── GAME TICK ─────────────────────────────────────────────
        function tick() {
            if (gameState !== 'playing') return;

            direction = nextDirection;

            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y,
            };

            // Wall collision → game over (1 life)
            if (
                newHead.x < 0 || newHead.x >= CONFIG.gridSize ||
                newHead.y < 0 || newHead.y >= CONFIG.gridSize
            ) {
                gameOver();
                return;
            }

            // Self collision → game over
            if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                gameOver();
                return;
            }

            // Move snake
            snake.unshift(newHead);
            stepsSinceLastFruit++;

            // Check fruit
            if (newHead.x === fruit.x && newHead.y === fruit.y) {
                fruitsEaten++;
                // Incremental scoring: 1st fruit = 1pt, 2nd = 2pts, etc.
                score += fruitsEaten;
                stepsSinceLastFruit = 0;
                scoreEl.textContent = score;
                placeFruit();
            } else {
                snake.pop();
            }

            // Idle penalty: -1 point for every 40 steps without eating
            if (stepsSinceLastFruit > 0 && stepsSinceLastFruit % CONFIG.idlePenaltyThreshold === 0) {
                score = Math.max(0, score - 1);
                scoreEl.textContent = score;
            }

            draw();

            // Schedule next tick (constant speed)
            tickTimer = setTimeout(tick, CONFIG.speed);
        }

        function gameOver() {
            gameState = 'over';
            clearTimeout(tickTimer);

            // Save to user profile
            if (typeof Auth !== 'undefined' && Auth.isLoggedIn()) {
                Auth.addGameHistory({
                    game: 'Snake',
                    score: score,
                });
                refreshBestScore();
            }

            draw();
        }

        // ─── DRAW ──────────────────────────────────────────────────
        function draw() {
            ctx.clearRect(0, 0, CONFIG.canvasSize, CONFIG.canvasSize);

            // Grid lines
            ctx.strokeStyle = CONFIG.gridLineColor;
            ctx.lineWidth = 1;
            for (let i = 0; i <= CONFIG.gridSize; i++) {
                const pos = i * CONFIG.cellSize;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, CONFIG.canvasSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(CONFIG.canvasSize, pos);
                ctx.stroke();
            }

            // Fruit
            ctx.fillStyle = CONFIG.fruitColor;
            ctx.beginPath();
            const fruitCenterX = fruit.x * CONFIG.cellSize + CONFIG.cellSize / 2;
            const fruitCenterY = fruit.y * CONFIG.cellSize + CONFIG.cellSize / 2;
            ctx.arc(fruitCenterX, fruitCenterY, CONFIG.cellSize / 2 - 3, 0, Math.PI * 2);
            ctx.fill();

            // Snake
            snake.forEach(function (seg, index) {
                const x = seg.x * CONFIG.cellSize;
                const y = seg.y * CONFIG.cellSize;
                const padding = 1;

                ctx.fillStyle = index === 0 ? CONFIG.snakeHeadColor : CONFIG.snakeColor;
                ctx.beginPath();
                roundRect(ctx, x + padding, y + padding, CONFIG.cellSize - padding * 2, CONFIG.cellSize - padding * 2, 4);
                ctx.fill();
            });

            // Overlays
            if (gameState === 'idle') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, CONFIG.canvasSize, CONFIG.canvasSize);
                ctx.fillStyle = '#fff';
                ctx.font = '22px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Press SPACE to start', CONFIG.canvasSize / 2, CONFIG.canvasSize / 2);
            }

            if (gameState === 'over') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, CONFIG.canvasSize, CONFIG.canvasSize);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 36px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', CONFIG.canvasSize / 2, CONFIG.canvasSize / 2 - 30);
                ctx.fillStyle = '#fff';
                ctx.font = '22px "Segoe UI", sans-serif';
                ctx.fillText('Score: ' + score, CONFIG.canvasSize / 2, CONFIG.canvasSize / 2 + 10);
                ctx.fillStyle = '#aaa';
                ctx.font = '16px "Segoe UI", sans-serif';
                ctx.fillText('Press SPACE to play again', CONFIG.canvasSize / 2, CONFIG.canvasSize / 2 + 40);
            }
        }

        // Helper: draw rounded rectangle
        function roundRect(ctx, x, y, w, h, r) {
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // Start
        init();
    })();
    </script>
</body>
</html>
